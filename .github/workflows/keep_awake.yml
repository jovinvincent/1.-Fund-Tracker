name: Keep App Awake (Selenium Heartbeat)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Fast HTTP Ping
        run: |
          echo "Sending fast ping to wake up dev and pre servers..."
          curl -s -f "https://ais-dev-twaf5v3niposla3rznryci-680968902783.europe-west2.run.app/api/health" || true
          curl -s -f "https://ais-pre-twaf5v3niposla3rznryci-680968902783.europe-west2.run.app/api/health" || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium wake-up script
        env:
          APP_URL: "https://ais-dev-twaf5v3niposla3rznryci-680968902783.europe-west2.run.app"
        run: python wake.py
